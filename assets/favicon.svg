<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="8" />
  <!-- Accent top curve -->
  <path d="M 64 120 Q 256 70 448 120" fill="none" stroke="rgba(165,180,252,0.3)" stroke-width="4" />
  <!-- Kanji '勝' -->
  <text x="256" y="295" 
        font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Microsoft YaHei', sans-serif" 
        font-size="285" 
        font-weight="900" 
        fill="url(#textGrad)" 
        text-anchor="middle" 
        dominant-baseline="central"
        filter="url(#glow)">勝</text>
  <!-- Domain accent pill at bottom -->
  <rect x="156" y="415" width="200" height="34" rx="17" fill="rgba(255,255,255,0.14)" />
  <text x="256" y="433" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="19" 
        font-weight="800" 
        fill="#c7d2fe" 
        letter-spacing="0.5" 
        text-anchor="middle" 
        dominant-baseline="central">syukatsu.win</text>
</svg>